  <rect width="800" height="500" rx="16" fill="url(#bg6)"/>
  <rect x="2" y="2" width="796" height="496" rx="14" fill="none" stroke="#2c336b" stroke-width="2"/>
  
  <!-- Interactive Controller / Game Dev Icon -->
