  </defs>
  <rect width="800" height="500" rx="16" fill="url(#actBg5)"/>
  <rect x="2" y="2" width="796" height="496" rx="14" fill="none" stroke="#1d4052" stroke-width="2"/>
  
  <!-- Presentation / Stage / Seminar Icon -->
