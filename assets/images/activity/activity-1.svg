  <rect width="800" height="500" rx="16" fill="url(#actBg1)"/>
  <rect x="2" y="2" width="796" height="496" rx="14" fill="none" stroke="#22324f" stroke-width="2"/>
  
  <!-- Camera / Workshop Activity Icon -->
