<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131f"/>
      <stop offset="50%" stop-color="#1a1c2e"/>
      <stop offset="100%" stop-color="#0e0f18"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#2a2e47" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)" opacity="0.6"/>

  <!-- Avatar Silhouette -->
  <circle cx="200" cy="145" r="42" fill="#24283d" stroke="#38bdf8" stroke-width="2"/>
  <path d="M130 240 C130 195 160 195 200 195 C240 195 270 195 270 240 Z" fill="#24283d" stroke="#a855f7" stroke-width="2"/>

  <!-- Creative camera/media badge -->
  <circle cx="260" cy="225" r="22" fill="#131522" stroke="url(#primaryGrad)" stroke-width="2"/>
  <path d="M252 222 h16 v8 h-16 z M256 220 h8 v2 h-8 z" fill="#38bdf8"/>

  <!-- Text Info -->
  <text x="200" y="320" font-family="'Prompt', sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle">
    [ รูปโปรไฟล์ของคุณ ]
  </text>
  <text x="200" y="348" font-family="'Prompt', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    แทนที่ด้วย: assets/images/profile/your-photo.jpg
  </text>
</svg>

